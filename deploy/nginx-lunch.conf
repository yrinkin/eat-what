# 오늘 뭐 먹지? Nginx 설정 (PLAN T24, T27)
# 화면(React 빌드 결과)은 /var/www/lunch에서 주고, /api는 FastAPI로 넘긴다.
# 설치는 deploy/deploy.sh(한 대) 또는 deploy/deploy-front.sh(EC2 front)가 한다.
# 아래 proxy_pass의 API_UPSTREAM 자리는 설치할 때 FastAPI 주소로 바뀐다. 한 대: 127.0.0.1:8000, EC2: <back 사설 IP>:8000

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;

    root /var/www/lunch;
    index index.html;

    # 빌드 파일은 이름에 해시가 붙어 있어 오래 캐시해도 된다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # 화면. 배포 후 예전 index.html이 쓰이지 않도록 매번 확인하게 한다.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }

    # API는 FastAPI로 넘긴다. DB 접속 정보는 FastAPI 쪽 backend/.env에만 있다.
    location /api/ {
        proxy_pass http://__API_UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
